<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Leticia Ledi — Generative AI for Work & Research portfolio">
  <title>Leticia Ledi — Generative AI for Work & Research</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f1edf7, #17151c);
      --surface: light-dark(#ffffff, #211e26);
      --surface-2: light-dark(#ece7f3, #2b2731);
      --text: light-dark(#25202c, #f5f1f8);
      --muted: light-dark(#746d7c, #bdb6c4);
      --line: light-dark(#ddd5e6, #3d3745);
      --accent: light-dark(#7256a3, #bda8df);
      --accent-2: light-dark(#d27e9b, #e9a9c0);
      --shadow: 0 20px 60px rgba(66, 48, 86, .12);
      --radius: 26px;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.65;
    }

    button, a { font: inherit; }
    a { color: inherit; }

    .app-root {
      min-height: 100vh;
      background-color: var(--bg);
      border-radius: 0;
      overflow-x: hidden;
    }

    .wrap {
      width: min(1180px, calc(100% - 44px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
    }

    .nav {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .nav::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      position: absolute;
      margin-left: 155px;
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent-2) 15%, transparent);
    }

    .brand {
      text-decoration: none;
      font-family: var(--serif);
      font-size: 1.18rem;
      letter-spacing: -.02em;
    }

    .nav-links {
      display: flex;
      gap: 12px;
      font-size: .88rem;
      color: var(--muted);
    }

    .nav-links a {
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 999px;
    }

    .nav-links a:hover {
      color: var(--text);
      background: var(--surface);
    }

    .hero {
      padding: 86px 0 72px;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 48px;
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 15px;
      color: var(--accent-2);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      font-family: var(--serif);
      font-weight: 500;
      line-height: 1.1;
      margin: 0;
    }

    h1 {
      font-size: clamp(3rem, 6.6vw, 5.7rem);
      letter-spacing: -.055em;
      max-width: 800px;
    }

    .hero-copy {
      margin-top: 24px;
      max-width: 640px;
      font-size: 1.1rem;
      color: var(--muted);
    }

    .hero-aside {
      padding: 34px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: var(--shadow);
      transform: rotate(1deg);
    }

    .hero-aside strong {
      display: block;
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .hero-aside p {
      margin: 0;
      color: var(--muted);
      font-size: .94rem;
    }

    .hero-aside p + p { margin-top: 6px; }

    section {
      padding: 76px 0;
      border-top: 1px solid var(--line);
    }

    .section-head {
      display: grid;
      grid-template-columns: .34fr 1fr;
      gap: 36px;
      margin-bottom: 44px;
      align-items: start;
    }

    .section-number {
      color: var(--accent);
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding-top: 8px;
    }

    h2 {
      font-size: clamp(2.1rem, 4vw, 3.3rem);
      letter-spacing: -.03em;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 34px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .panel p { margin: 0 0 16px; }
    .panel p:last-child { margin-bottom: 0; }

    .meta-grid {
      display: grid;
      gap: 18px;
    }

    .meta-item {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .meta-item:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .meta-label {
      display: block;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      font-size: .68rem;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .course-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 28px;
      align-items: stretch;
    }

    .course-intro {
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: #fff;
      border-radius: var(--radius);
      padding: 38px;
      box-shadow: var(--shadow);
    }

    .course-intro .eyebrow { color: rgba(255,255,255,.82); }
    .course-intro h3 { font-size: 2rem; margin-bottom: 18px; }
    .course-intro p { color: rgba(255,255,255,.84); }

    .module-list {
      display: grid;
      gap: 12px;
    }

    .module {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 12px;
      align-items: start;
      box-shadow: 0 8px 28px rgba(66, 48, 86, .05);
    }

    .module-index {
      color: var(--accent);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding-top: 3px;
    }

    .module h3 { font-size: 1.18rem; }
    .module p { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }

    .weeks {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .week-card {
      position: relative;
      min-height: 210px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .week-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
    }

    .week-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
    }

    .week {
      color: var(--accent-2);
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .status {
      font-size: .7rem;
      color: var(--muted);
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .week-card h3 { font-size: 1.42rem; margin-bottom: 8px; }
    .week-card p { margin: 0; color: var(--muted); font-size: .9rem; }

    .submission {
      display: inline-flex;
      margin-top: 18px;
      color: var(--accent);
      text-decoration: none;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .submission::after { content: " →"; }
    .submission:hover { text-decoration: underline; }

    .contact {
      display: flex;
      justify-content: space-between;
      gap: 28px;
      align-items: end;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 34px;
    }

    .contact p {
      margin: 16px 0 0;
      color: var(--muted);
      max-width: 620px;
    }

      white-space: nowrap;
